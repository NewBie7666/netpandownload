name: Windows Desktop EXE

on:
  push:
    branches:
      - main
      - feat/desktop-code-magnet-search-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle aria2 executable
        shell: pwsh
        run: ./scripts/prepare-aria2.ps1

      - name: Bundle yt-dlp executable
        shell: pwsh
        run: ./scripts/prepare-ytdlp.ps1

      - name: Magnet search regression
        run: npx tsx tests/release/magnetSearch.test.ts

      - name: Build portable Windows EXE
        run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged EXE and aria2
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE artifact not found" }
          if (-not (Test-Path "resources/aria2/win/aria2c.exe")) { throw "aria2c.exe missing" }
          Write-Host "Built $($exe.FullName)"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NetPanDownload-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
