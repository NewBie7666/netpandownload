name: Windows Desktop EXE

on:
  push:
    branches:
      - main
      - feat/desktop-code-magnet-search-20261115
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle aria2 executable
        shell: pwsh
        run: ./scripts/prepare-aria2.ps1

      - name: Bundle yt-dlp executable
        shell: pwsh
        run: ./scripts/prepare-ytdlp.ps1

      - name: Magnet search regression
        run: npx tsx tests/release/magnetSearch.test.ts

      - name: General magnet search regression
        run: npx tsx tests/release/magnetGeneralSearch.test.ts

      - name: Bilibili multi-part resolver regression
        run: npx tsx server/providers/bilibili/resolver/resolver.test.ts

      - name: Bilibili P9 CID/media regression
        run: npx tsx tests/release/bilibiliPartMedia.test.ts

      - name: BT metadata, deduplication and RPC regression
        run: npx tsx tests/release/btMetadata.test.ts

      - name: Set up Python for local BT seeder (CI only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test-only libtorrent
        run: python -m pip install --disable-pip-version-check "libtorrent==2.1.1"

      # Same-host BT peers can be filtered by clients/runner networking. Keep the
      # failed outcome visible without blocking delivery of a diagnostic EXE.
      - name: End-to-end BitTorrent metadata and real-byte transfer (experimental)
        continue-on-error: true
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP "netpan-bt-e2e"
          New-Item -ItemType Directory -Path $fixturePath -Force | Out-Null
          $seed = Start-Process python -ArgumentList @("tests/e2e/btLocalSeeder.py", $fixturePath) -PassThru -NoNewWindow
          try {
            $ready = Join-Path $fixturePath "fixture.json"
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              if (Test-Path -LiteralPath $ready) { $ok = $true; break }
              if ($seed.HasExited) { throw "BT fixture seeder exited early" }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ok) { throw "BT fixture seeder did not become ready" }
            npx tsx tests/e2e/btLocalIntegration.test.ts
            if ($LASTEXITCODE -ne 0) { throw "BT real-byte transfer E2E failed" }
          } finally {
            Stop-Process -Id $seed.Id -Force -ErrorAction SilentlyContinue
          }

      - name: BT task deletion and file safety regression
        run: npx tsx tests/release/btDelete.test.ts

      - name: Build portable Windows EXE
        run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged EXE and aria2
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE artifact not found" }
          if (-not (Test-Path "resources/aria2/win/aria2c.exe")) { throw "aria2c.exe missing" }
          Write-Host "Built $($exe.FullName)"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NetPanDownload-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
