name: HLS CDN manifest connectivity (Windows, no media segments)
on:
  push:
    branches: [feat/windows-portable-bundled-runtime-20261105]
permissions:
  contents: read
jobs:
  manifest-only:
    runs-on: windows-2022
    timeout-minutes: 9
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test pinned HLS transport on the provided public manifest (no segments/keys)
        run: npx tsx scripts/probe-hls-manifest.ts
