name: TVBox URL Windows connectivity evidence
on:
  push:
    branches: [feat/windows-portable-bundled-runtime-20261105]
permissions:
  contents: read
jobs:
  config-only:
    runs-on: windows-2022
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read only two TVBox config endpoints, no media or scripts
        run: npx tsx scripts/probe-tvbox-on-windows.ts
