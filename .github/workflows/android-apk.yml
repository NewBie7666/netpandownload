name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides Android command line tools and SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and build debug APK
        run: gradle -p android-mobile :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPanDownload-Android-arm64-debug
          path: android-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
