name: VideoSource HG config smoke (non-blocking)
on:
  push:
    branches: [feat/video-source-provider-20261101]
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Fetch HG config metadata only (no Spider and no media)
        run: node scripts/probe-hg-tvbox.mjs
