name: HTTP direct download checks
on:
  pull_request:
  push:
    branches:
      - feat/http-direct-download-20261019

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:direct
      - run: npm run test:page-scan
      - run: npm run test:page-selection
      - run: npm run test:interactive-page
      - run: npm run test:file-request
      - run: npm run test:dns
      - run: npm run test:pause
      - run: npm run test:unified-actions
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run build:electron
