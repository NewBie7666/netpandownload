name: Deploy NetPan to Tencent Cloud

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed SHA of the integration branch (must equal selected ref)
        required: true
        type: string

permissions: {}

concurrency:
  group: netpandownload-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test the exact reviewed Linux release without production secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - name: Require manual integration branch release and exact SHA
        id: identity
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/feat/private-web-unified-download-20261023 ]]
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ && "$REVIEWED_SHA" == "$GITHUB_SHA" ]]
          echo "sha=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install fixture tools and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 nginx-core apache2-utils
          npm ci --ignore-scripts
      - name: Build frontend, backend and Electron
        run: |
          npm run build
          npm run build:electron
      - name: Full preserved regression, real HTTP TestBot and release rollback tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run test:all-preserved 2>&1 | tee reports/regression.txt
          npm run test:testbot 2>&1 | tee reports/testbot.txt
          npx playwright install --with-deps chromium
          npm run test:browser
          python3 deploy/test-release.py 2>&1 | tee reports/deployment.txt
          python3 deploy/test-nginx.py 2>&1 | tee reports/nginx.txt
          bash -n deploy/bootstrap.sh deploy/audit-server.sh deploy/upload-release.sh
      - name: Build Linux package with SHA-256 manifest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
          python3 deploy/package-release.py --sha "$GITHUB_SHA"
          read -r checksum archive < .release/archive.sha256
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Preserve all test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netpan-release-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve exact tested Linux release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netpan-linux-${{ github.sha }}
          path: |
            .release/*.tar.gz
            .release/archive.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Protected production upload, health check and automatic rollback
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Refuse missing or unprotected Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/netpan-environment.json"
          jq -e '.deployment_branch_policy.custom_branch_policies == true and any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)' "$RUNNER_TEMP/netpan-environment.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" | jq -e '.branch_policies | length == 1 and .[0].name == "feat/private-web-unified-download-20261023" and .[0].type == "branch"' >/dev/null
      - name: Download only this run's tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: netpan-linux-${{ needs.verify.outputs.sha }}
          path: .release
      - name: Strict SSH upload and isolated release switch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
          DEPLOY_CHECKSUM: ${{ needs.verify.outputs.checksum }}
          NETPAN_TEST_BASE_URL: ${{ secrets.PUBLIC_ORIGIN }}
          NETPAN_TEST_BASIC_USER: ${{ secrets.SMOKE_USER }}
          NETPAN_TEST_BASIC_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash deploy/upload-release.sh
      - name: Preserve release and rollback log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netpan-production-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
