name: Test X video download

on:
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'tests/release/xProvider.test.ts'
      - 'package*.json'
      - '.github/workflows/test-x.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'tests/release/xProvider.test.ts'
      - 'package*.json'
      - '.github/workflows/test-x.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:server
      - run: npm run build:client
      - run: npm run build:electron
      - run: npx tsx tests/release/xProvider.test.ts
