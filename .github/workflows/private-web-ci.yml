name: Unified downloader - regression and private web

on:
  push:
    branches: [feat/private-web-unified-download-20261023]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Dependencies and Linux fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 nginx-core apache2-utils e2fsprogs util-linux
          npm ci --ignore-scripts
      - name: Client, server and preserved Electron build
        run: |
          npm run build
          npm run build:electron
      - name: Preserved functionality regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run test:all-preserved 2>&1 | tee reports/regression.txt
      - name: Real aria2 HTTP TestBot
        shell: bash
        run: |
          set -euo pipefail
          npm run test:testbot 2>&1 | tee reports/testbot.txt
      - name: Desktop and mobile Chromium acceptance
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run test:douyin-browser 2>&1 | tee reports/douyin-browser.txt
          npm run test:browser
      - name: Deployment rollback and private HTTPS fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/test-release.py 2>&1 | tee reports/deployment.txt
          python3 deploy/test-upload.py 2>&1 | tee reports/upload.txt
          node --test deploy/test-public-smoke.mjs 2>&1 | tee reports/public-smoke.txt
          python3 deploy/test-tls-setup.py 2>&1 | tee reports/tls-setup.txt
          python3 deploy/test-storage-setup.py 2>&1 | tee reports/storage-setup.txt
          sudo python3 deploy/test-storage-loop.py 2>&1 | tee reports/storage-loop.txt
          python3 deploy/test-start.py 2>&1 | tee reports/start.txt
          python3 deploy/test-nginx.py 2>&1 | tee reports/nginx.txt
          bash -n deploy/bootstrap.sh deploy/audit-server.sh deploy/upload-release.sh
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build deployment artifact without credentials
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts
          python3 deploy/package-release.py --sha "$GITHUB_SHA"
          (cd .release && sha256sum -c archive.sha256)
          python3 deploy/verify-package.py --sha "$GITHUB_SHA" --archive ".release/netpan-$GITHUB_SHA.tar.gz"
      - name: Preserve Linux package (never deploy on push)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netpan-linux-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/*.tar.gz
            .release/archive.sha256
          retention-days: 14
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netpan-ci-evidence-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
