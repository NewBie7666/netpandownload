name: HLS VOD focused integration

on:
  push:
    branches: [feat/video-source-provider-20261101]
  pull_request:

permissions:
  contents: read

jobs:
  hls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Provision FFmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: HLS playlist, AES-128 and real local MPEG-TS-to-MP4 acceptance
        run: npm run test:hls
      - name: Client and server TypeScript build
        run: npm run build
