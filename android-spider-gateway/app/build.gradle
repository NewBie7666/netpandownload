plugins { id 'com.android.application' }

android {
    namespace 'com.newbie7666.netpandownload.spidergateway'
    compileSdk 35

    defaultConfig {
        applicationId 'com.newbie7666.netpandownload.spidergateway'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
